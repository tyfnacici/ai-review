name: AI review

# Reusable workflow. Callers grant `contents: write` (only to resolve fixed review threads) + `pull-requests: write`.
on:
  workflow_call:
    inputs:
      model:
        description: Pi model spec
        type: string
        default: zai/glm-5.3
      release_from:
        description: PRs whose head is this branch get a release review (combined effect); all others a feature review
        type: string
        default: staging
      trigger_label:
        description: Adding this label to a PR runs the review again (follow-up); the label is removed afterwards
        type: string
        default: ai-review

jobs:
  secrets:
    # Deterministic secret scan of the lines this PR adds, on every push; fails the check on a leak (values are redacted).
    if: >-
      github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.action != 'labeled'
    runs-on: [self-hosted, s10-review]
    timeout-minutes: 5
    env:
      GITLEAKS: 8.30.1
      GITLEAKS_SHA256: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
    steps:
      - name: Scan added lines with gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin="$HOME/bin/gitleaks-$GITLEAKS"
          if [ ! -x "$bin" ]; then
            tmp=$(mktemp -d)
            curl -fsSL -o "$tmp/g.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS/gitleaks_${GITLEAKS}_linux_arm64.tar.gz"
            echo "$GITLEAKS_SHA256  $tmp/g.tgz" | sha256sum -c -
            tar xzf "$tmp/g.tgz" -C "$tmp" gitleaks
            mkdir -p "$HOME/bin" && mv "$tmp/gitleaks" "$bin" && rm -rf "$tmp"
          fi
          gh pr diff "${{ github.event.pull_request.number }}" -R "${{ github.repository }}" \
            | { grep '^+' || true; } | "$bin" stdin --redact --no-banner -v

  review:
    # Runs when the PR is opened or marked ready, and again whenever the trigger label is added; not on every push.
    # Drafts and fork PRs are skipped (forks get no secrets and must never reach the s10 runner).
    if: >-
      github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
      && (contains(fromJSON('["opened", "reopened", "ready_for_review"]'), github.event.action)
          || (github.event.action == 'labeled' && github.event.label.name == inputs.trigger_label))
    runs-on: [self-hosted, s10-review]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Sync reviewer
        run: git -C "$HOME/ai-review" fetch -q origin main && git -C "$HOME/ai-review" reset -q --hard origin/main

      - name: Review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          WORKDIR: ${{ github.workspace }}
          MODEL: ${{ inputs.model }}
          MODE: ${{ github.head_ref == inputs.release_from && 'release' || 'feature' }}
        run: '"$HOME/ai-review/run.sh"'

      - name: Remove trigger label
        if: always() && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "${{ github.event.pull_request.number }}" -R "${{ github.repository }}" --remove-label "${{ inputs.trigger_label }}"
