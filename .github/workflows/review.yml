name: AI review

# Reusable workflow. Callers grant `contents: write` (only to resolve fixed review threads) + `pull-requests: write`.
on:
  workflow_call:
    inputs:
      runs_on:
        description: Runner labels as a JSON list
        type: string
        default: '["self-hosted", "s10-review"]'
      model:
        description: Pi model spec (provider/model)
        type: string
        default: zai/glm-5.3-flash
      thinking:
        description: Pi thinking level
        type: string
        default: medium
      parallel:
        description: Follow-up calls at once for a large follow-up; keep 1 on plans with low concurrency
        type: number
        default: 1
      batch_chars:
        description: Diff characters per review call; larger diffs are split into batches
        type: number
        default: 120000
      time_budget:
        description: Minutes for the whole review; calls still running at the end are stopped (0 = no limit)
        type: number
        default: 15
      release_from:
        description: PRs whose head is this branch get a release review (combined effect); all others a feature review
        type: string
        default: staging
      trigger_label:
        description: Adding this label to a PR runs the review again (follow-up); the label is removed afterwards
        type: string
        default: ai-review

jobs:
  secrets:
    # Deterministic secret scan of the lines this PR adds, on every push; fails the check on a leak (values are redacted).
    if: >-
      github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.action != 'labeled'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 10
    env:
      GITLEAKS: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Scan added lines with gitleaks
        run: |
          bin="$HOME/bin/gitleaks-$GITLEAKS"
          if [ ! -x "$bin" ]; then
            case $(uname -m) in
              aarch64|arm64) arch=arm64 sha=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080 ;;
              x86_64) arch=x64 sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
              *) echo "unsupported architecture: $(uname -m)"; exit 1 ;;
            esac
            tmp=$(mktemp -d)
            curl -fsSL -o "$tmp/g.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS/gitleaks_${GITLEAKS}_linux_$arch.tar.gz"
            echo "$sha  $tmp/g.tgz" | sha256sum -c -
            tar xzf "$tmp/g.tgz" -C "$tmp" gitleaks
            mkdir -p "$HOME/bin" && mv "$tmp/gitleaks" "$bin" && rm -rf "$tmp"
          fi
          # Local diff: GitHub's diff API refuses PRs with more than 300 files.
          git diff "origin/${{ github.base_ref }}...HEAD" \
            | { grep '^+' || true; } | "$bin" stdin --redact --no-banner -v

  review:
    # Runs when the PR is opened or marked ready, and again whenever the trigger label is added; not on every push.
    # Drafts and fork PRs are skipped (forks get no secrets and must never reach a self-hosted runner).
    if: >-
      github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
      && (contains(fromJSON('["opened", "reopened", "ready_for_review"]'), github.event.action)
          || (github.event.action == 'labeled' && github.event.label.name == inputs.trigger_label))
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    # One agent run per review (a large PR gets a broad review) within time_budget, plus waiting for the model lock.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Sync reviewer and Pi
        # Several runners on one machine share the reviewer clone and Pi, so only one job updates them at a time.
        run: |
          exec 9>"$HOME/.ai-review.lock" && flock 9
          git -C "$HOME/ai-review" fetch -q origin main && git -C "$HOME/ai-review" reset -q --hard origin/main
          "$HOME/ai-review/update-pi.sh" || echo "::warning::Pi update failed; using the installed version"

      - name: Review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          WORKDIR: ${{ github.workspace }}
          MODEL: ${{ inputs.model }}
          THINKING: ${{ inputs.thinking }}
          PARALLEL: ${{ inputs.parallel }}
          BATCH_CHARS: ${{ inputs.batch_chars }}
          TIME_BUDGET: ${{ inputs.time_budget }}
          MODE: ${{ github.head_ref == inputs.release_from && 'release' || 'feature' }}
        run: '"$HOME/ai-review/run.sh"'

      - name: Remove trigger label
        if: always() && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/${{ inputs.trigger_label }}" --silent
